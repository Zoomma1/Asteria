spring:
  datasource:
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    username: Asteria
    url: jdbc:postgresql://localhost:5434/AsteriaDB
  jpa:
    show-sql: 'true'
    hibernate:
      ddl-auto: validate

# Logs
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

server:
  servlet:
    context-path: /AsteriaAPI
  port: 8080

cors:
  allowed-origin: "*"
  insecure: false
  postman-testing : true
