version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: AsteriaDB
    restart: on-failure
    environment:
      POSTGRES_USER: Asteria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: AsteriaDB
    ports:
      - "5544:5542"
    volumes:
      - pg_data_asteria:/var/lib/postgresql/16/data

  backend:
    build: .
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5542/AsteriaDB
      SPRING_DATASOURCE_USERNAME: Asteria
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/logs

volumes:
  pg_data_asteria:
